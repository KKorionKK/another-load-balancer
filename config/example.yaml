server:
  listen_addr: ":8080"
  shutdown_timeout: 10s

balancer:
  strategy: roundrobin   # roundrobin | leastconn

upstreams:
  - name: backend-1
    url: "http://localhost:9001"
    weight: 1
  - name: backend-2
    url: "http://localhost:9002"
    weight: 1
  - name: backend-3
    url: "http://localhost:9003"
    weight: 1

health_check:
  path: "/healthz"
  interval: 3s
  timeout: 2s
  healthy_threshold: 2
  unhealthy_threshold: 3

transport:
  max_idle_conns: 200
  max_idle_conns_per_host: 50
  idle_conn_timeout: 90s
  dial_timeout: 5s
  tls_handshake_timeout: 5s
  response_header_timeout: 10s

metrics:
  enabled: true
  path: "/metrics"

logging:
  level: info              # debug | info | warn | error
  format: json             # json | text
